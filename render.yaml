services:
  - type: web
    name: dbu-ai-kiosk
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 kirti.kirti.cat_ui_server:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TTS_API_KEY
        sync: false
